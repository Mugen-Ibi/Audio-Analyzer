[package]
name = "audio_analyzer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[features]
default = ["desktop", "asio"]
audio-device = ["dep:cpal"]
asio = ["audio-device", "cpal/asio"]
desktop = ["audio-device", "dep:eframe", "dep:egui_plot"]

[[bin]]
name = "audio_analyzer"
path = "src/main.rs"
required-features = ["desktop"]

[[test]]
name = "live_audio"
required-features = ["audio-device"]

[dependencies]
# オーディオI/O。WindowsのWASAPIおよびASIOをサポート
cpal = { version = "0.18.2", optional = true }

# 高速フーリエ変換
rustfft = "6.4.1"

# ロックフリー・リングバッファ
ringbuf = "0.5.3"

# Immediate Mode GUIフレームワーク
# Keep the existing OpenGL renderer; eframe 0.37 defaults to WGPU.
eframe = { version = "0.37.0", optional = true, default-features = false, features = [
    "accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "web_screen_reader", "x11",
] }

# egui用のプロットライブラリ
egui_plot = { version = "0.38.0", optional = true }
