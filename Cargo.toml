[package]
name = "audio_analyzer"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop", "asio"]
audio-device = ["dep:cpal"]
asio = ["audio-device", "cpal/asio"]
desktop = ["audio-device", "dep:eframe", "dep:egui_plot", "dep:image"]

[[bin]]
name = "audio_analyzer"
path = "src/main.rs"
required-features = ["desktop"]

[[test]]
name = "live_audio"
required-features = ["audio-device"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# オーディオI/O。WindowsのWASAPIおよびASIOをサポート
cpal = { version = "0.18.1", optional = true }

# 高速フーリエ変換
rustfft = "6.4.1"

# ロックフリー・リングバッファ
ringbuf = "0.5.0"

# Immediate Mode GUIフレームワーク
eframe = { version = "0.30.0", optional = true }

# egui用のプロットライブラリ
egui_plot = { version = "0.30.0", optional = true }

# Retain 0.30.0, with the zero-size framebuffer read/draw fix documented locally.
[patch.crates-io]
egui_glow = { path = "vendor/egui_glow" }
